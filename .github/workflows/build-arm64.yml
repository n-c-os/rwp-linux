            --memtest none \
            --bootappend-live "boot=live components username=rwp hostname=rwp-linux locales=fr_FR.UTF-8 keyboard-layouts=fr" \
            --iso-volume "RWP_LINUX_04_ARM64"

          mkdir -p config/package-lists \
            config/includes.chroot/etc/flatpak/remotes.d \
            config/includes.chroot/usr/share/rwp-linux

          cat > config/package-lists/10-core.list.chroot <<'PACKAGES_CORE'
          linux-image-arm64
          live-boot
          live-config
          live-config-systemd
          sudo
          locales
          console-setup
          ca-certificates
          network-manager
          wpasupplicant
          flatpak
          pipewire-audio
          wireplumber
          bluez
          udisks2
          polkitd
          PACKAGES_CORE

          cat > config/package-lists/20-plasma.list.chroot <<'PACKAGES_PLASMA'
          kde-plasma-desktop
          sddm
          xserver-xorg
          kwin-x11
          plasma-nm
          plasma-pa
          dolphin
          konsole
          plasma-discover
          plasma-discover-backend-flatpak
          PACKAGES_PLASMA

          cat > config/package-lists/30-apps.list.chroot <<'PACKAGES_APPS'
          firefox-esr
          qemu-guest-agent
          spice-vdagent
          PACKAGES_APPS

          cat > config/package-lists/40-installer.list.chroot_live <<'PACKAGES_INSTALLER'
          debian-installer-launcher
          PACKAGES_INSTALLER

          printf '%s\n' 'RWP Linux 0.4 Alpha (Debian 13 ARM64)' > \
            config/includes.chroot/usr/share/rwp-linux/RELEASE

          curl --fail --show-error --silent --location --retry 3 \
            https://flathub.org/repo/flathub.flatpakrepo \
            --output config/includes.chroot/etc/flatpak/remotes.d/flathub.flatpakrepo
          grep -q '^\[Flatpak Repo\]' config/includes.chroot/etc/flatpak/remotes.d/flathub.flatpakrepo

          # lb config peut creer live.list.chroot ; verifier les listes RWP par leur nom.
          echo '== Listes de paquets disponibles =='
          find config/package-lists -maxdepth 1 -type f -name '*.list.chroot*' -print | sort
          for expected in 10-core.list.chroot 20-plasma.list.chroot 30-apps.list.chroot 40-installer.list.chroot_live; do
            if [ ! -s "config/package-lists/$expected" ]; then
              echo "Liste RWP manquante ou vide : $expected" >&2
              exit 2
            fi
          done
          shopt -s nullglob
          lists=(config/package-lists/*.list.chroot*)
          for list in "${lists[@]}"; do
            while IFS= read -r pkg || [[ -n "$pkg" ]]; do
              [[ -z "$pkg" || "$pkg" = \#* ]] && continue
              apt-cache show "$pkg" >/dev/null 2>&1 || {
                echo "Missing Debian arm64 package: $pkg ($list)" >&2
                exit 2
              }
            done < "$list"
          done

          echo '== Building ARM64 Debian Live ISO =='
          lb build

          mapfile -d '' -t images < <(find "$WORK" -maxdepth 1 -type f -name '*.iso' -print0)
          (( ${#images[@]} == 1 )) || { echo 'ISO missing or ambiguous' >&2; exit 3; }
          ISO="$OUT/RWP-Linux-0.4-alpha-arm64.iso"
          cp -- "${images[0]}" "$ISO"
          (cd "$OUT" && sha256sum "$(basename "$ISO")" > "$(basename "$ISO").sha256")
          ls -lh "$ISO"
          IN_CONTAINER

      - name: Verify ISO file and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          test -s output/RWP-Linux-0.4-alpha-arm64.iso
          (cd output && sha256sum -c RWP-Linux-0.4-alpha-arm64.iso.sha256)
          # An ISO build finishing is not a substitute for a VM boot test.
          file output/RWP-Linux-0.4-alpha-arm64.iso

      - name: Publish ARM64 ISO
        uses: actions/upload-artifact@v4
        with:
          name: RWP-Linux-0.4-alpha-arm64
          path: |
            output/*.iso
            output/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Publish build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RWP-arm64-build-log
          path: output/build.log
          if-no-files-found: ignore
          retention-days: 7

